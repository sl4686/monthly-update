<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Snapshot — Monthly Operating Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=20" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">▚</span>
    <div>
      <h1>Business Snapshot</h1>
      <p class="brand-sub" id="periodLabel">No data loaded</p>
    </div>
  </div>
</header>


<main id="dashboard" class="dashboard">
  <div class="pinned" id="pinned">
    <section class="exec-summary" id="execSummary" aria-label="Executive summary"></section>
    <section class="kpi-strip" id="kpiStrip" aria-label="Key metrics"></section>
  </div>
  <div class="body-grid">
    <nav class="spine" id="spine" aria-label="Workbook sections"></nav>
    <div class="sections" id="sections"></div>
  </div>
</main>

<footer class="footer">
  <span>Built from the Monthly Business Snapshot workbook · data as of Jul ’26 · build v20</span>
</footer>

<script src="app.js?v=20"></script>
</body>
</html>
